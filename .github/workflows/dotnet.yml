name: Build .NET Framework Project

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Restore NuGet packages
        run: nuget restore udp-p2p-client\udp-p2p-client\udp-p2p-client.csproj

      - name: Build project
        run: msbuild udp-p2p-client\udp-p2p-client\udp-p2p-client.csproj /p:Configuration=Debug /m
